# The Visual C++ runtime is not part of Windows. A binary that links it
# dynamically installs on a clean machine and then refuses to start, because
# VCRUNTIME140.dll ships in the Visual C++ Redistributable and a clean machine
# does not have it. Every machine this project builds on has Visual Studio, so
# none of them shows the failure.
#
# `+crt-static` links the VC runtime and the UCRT into the binary. What it
# costs: a CRT security fix needs a rebuild of this application, where a
# dynamically linked one would pick it up from a serviced DLL. Declaring a
# `Microsoft.VCLibs.140.00.UWPDesktop` framework dependency in the manifest is
# the alternative, and it is declined because it makes the application depend
# on something the machine has to acquire before it can start.
#
# The check that says the flag worked is `packaging/windows/check-imports.ps1`,
# which walks the PE import table and refuses any import that does not ship with
# Windows.
#
# This key names the triple, so Linux and macOS builds are untouched.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
